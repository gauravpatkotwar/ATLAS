[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow tests",
    "ai: AI-related tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "PTH",
    "RUF", "ERA", "PD", "PL", "TRY", "NPY", "TID", "QF", "RSE",
]
ignore = ["E501", "B008", "C901", "T201", "T203"]
per-file-ignores = {
    "tests/*": ["S101", "S106", "T201", "T203"],
    "tests/**/*.py": ["S101", "S106", "T201", "T203"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
enable_error_code = ["ignore-without-code"]
disable_error_code = ["attr-defined", "union-attr"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "tests",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow tests",
    "ai: AI-related tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.commitizen]
version = "0.1.0"
version_files = ["pyproject.toml"]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
