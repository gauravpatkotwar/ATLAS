<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Control Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #222;
      margin-bottom: 16px;
    }
    h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .nav-links a { color: #888; text-decoration: none; font-size: 13px; margin-left: 14px; }
    .nav-links a:hover { color: #fff; }

    /* Auth Form */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .auth-card h2 { font-size: 16px; color: #fff; margin-bottom: 12px; }
    .auth-input {
      width: 100%;
      padding: 10px;
      background: #000;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00ff66;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 14px;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      padding: 10px;
      background: #00ff66;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Main Console Grid */
    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: #111;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #222;
      font-size: 12px;
    }
    .stat-item { display: flex; gap: 6px; }
    .stat-lbl { color: #666; }
    .stat-val { color: #00ff66; font-weight: 600; }

    .console-body {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 16px;
      flex: 1;
    }

    .modules-sidebar {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      overflow-y: auto;
      max-height: 600px;
      font-size: 12px;
    }
    .module-group { margin-bottom: 10px; }
    .module-name { color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .cmd-btn {
      background: #222;
      border: 1px solid #333;
      color: #00ff66;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin: 2px 2px 2px 0;
      font-family: monospace;
    }
    .cmd-btn:hover { background: #333; color: #fff; }

    .terminal-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .terminal-out {
      flex: 1;
      background: #050505;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      max-height: 520px;
      min-height: 420px;
    }
    .cmd-line { color: #00ff66; margin-top: 8px; font-weight: bold; }
    .cmd-res { color: #ddd; white-space: pre-wrap; margin-left: 8px; margin-bottom: 8px; }

    .cmd-form { display: flex; gap: 8px; }
    .cli-input {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 9px 12px;
      color: #00ff66;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    .exec-btn {
      background: #00ff66;
      border: none;
      color: #000;
      padding: 0 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Atlas Control Center</h1>
    <div class="nav-links">
      <a href="#" onclick="clearLogs(); return false;">Clear Output</a>
      <a href="/">Back to SaaS</a>
    </div>
  </header>

  <!-- Passcode Auth -->
  <div id="auth-view" class="auth-container">
    <div class="auth-card">
      <h2>Creator Authentication</h2>
      <input type="password" id="key-input" class="auth-input" placeholder="Enter Creator Key" />
      <button onclick="login()" class="auth-btn">Unlock Console</button>
    </div>
  </div>

  <!-- Main Console -->
  <div id="main-view" style="display: none; flex-direction: column; flex: 1;">
    <!-- Stats Strip -->
    <div class="stats-bar">
      <div class="stat-item"><span class="stat-lbl">Users:</span><span class="stat-val" id="s-users">1,280</span></div>
      <div class="stat-item"><span class="stat-lbl">Companies:</span><span class="stat-val" id="s-companies">14</span></div>
      <div class="stat-item"><span class="stat-lbl">AI Reqs:</span><span class="stat-val">18/s</span></div>
      <div class="stat-item"><span class="stat-lbl">Latency:</span><span class="stat-val">34ms</span></div>
      <div class="stat-item"><span class="stat-lbl">Health:</span><span class="stat-val">100% OK</span></div>
    </div>

    <!-- Console Layout -->
    <div class="console-body">
      <!-- 24 Modules -->
      <div class="modules-sidebar" id="modules-list"></div>

      <!-- Terminal Output & Input -->
      <div class="terminal-panel">
        <div class="terminal-out" id="term-out">
          <div style="color: #666;">[ATLAS CONTROL CENTER] Plain & Simple Admin Console. Ready.</div>
        </div>

        <form class="cmd-form" onsubmit="event.preventDefault(); runCli();">
          <span style="color: #00ff66; font-family: monospace; line-height: 34px;">admin@atlas:~$</span>
          <input type="text" id="cli-in" class="cli-input" placeholder="Type command (e.g. status, company list, user search, help)..." />
          <button type="submit" class="exec-btn">Run</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const MODULES = [
      { name: '1. System Overview', cmds: ['status', 'health', 'metrics', 'uptime', 'version'] },
      { name: '2. Company Management', cmds: ['company list', 'company view', 'company suspend', 'company activate'] },
      { name: '3. User Management', cmds: ['user search', 'user info', 'user disable', 'user enable'] },
      { name: '4. AI Control', cmds: ['ai models', 'ai switch', 'ai usage', 'ai health'] },
      { name: '5. Atlas Brain', cmds: ['brain search', 'brain inspect', 'brain reindex'] },
      { name: '6. Candidate Management', cmds: ['candidate search', 'candidate merge', 'candidate export'] },
      { name: '7. Job Management', cmds: ['job search', 'job rebuild', 'job archive'] },
      { name: '8. Billing', cmds: ['billing invoices', 'billing revenue', 'billing subscriptions'] },
      { name: '9. Storage', cmds: ['storage usage', 'storage cleanup', 'storage backups'] },
      { name: '10. Queue Management', cmds: ['queue list', 'queue retry', 'queue purge'] },
      { name: '11. Database', cmds: ['db stats', 'db backup', 'db connections'] },
      { name: '12. Monitoring', cmds: ['logs', 'errors', 'trace', 'metrics'] },
      { name: '13. Security', cmds: ['sessions', 'tokens', 'audit', 'api-keys'] },
      { name: '14. Feature Flags', cmds: ['feature list', 'feature enable', 'feature disable'] },
      { name: '15. Deployments', cmds: ['deploy status', 'deploy restart', 'deploy rollback'] },
      { name: '16. Communication', cmds: ['emails', 'notifications', 'webhooks'] },
      { name: '17. Atlas Academy', cmds: ['courses', 'instructors', 'subscriptions'] },
      { name: '18. Atlas TV', cmds: ['videos', 'channels', 'analytics'] },
      { name: '19. Analytics', cmds: ['dashboard', 'revenue', 'growth', 'traffic'] },
      { name: '20. Emergency Mode', cmds: ['maintenance on', 'maintenance off', 'panic status'] },
      { name: '21. Developer Tools', cmds: ['cache clear', 'seed', 'fixtures'] },
      { name: '22. AI Agents', cmds: ['agent list', 'agent restart', 'agent logs'] },
      { name: '23. Audit Logs', cmds: ['audit list', 'audit export'] },
      { name: '24. Live Dashboard', cmds: ['metrics', 'active-users'] },
    ];

    function initModules() {
      const el = document.getElementById('modules-list');
      MODULES.forEach(m => {
        const div = document.createElement('div');
        div.className = 'module-group';
        let btns = '';
        m.cmds.forEach(c => {
          btns += `<button class="cmd-btn" onclick="exec('${c}')">${c}</button>`;
        });
        div.innerHTML = `<div class="module-name">${m.name}</div><div>${btns}</div>`;
        el.appendChild(div);
      });
    }

    function login() {
      const val = document.getElementById('key-input').value.trim();
      if (val === 'G42672840$p') {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'flex';
        loadStats();
      } else {
        alert('Invalid Creator Key');
      }
    }

    let creatorPasscode = 'G42672840$p';

    async function loadStats() {
      try {
        const res = await fetch('/api/v1/admin/cmd/metrics', {
          headers: { 'X-Creator-Key': creatorPasscode }
        });
        if (res.ok) {
          const d = await res.json();
          if (d.total_users) document.getElementById('s-users').textContent = d.total_users;
          if (d.active_companies) document.getElementById('s-companies').textContent = d.active_companies;
        }
      } catch (e) {}
    }

    async function exec(cmdStr) {
      if (!cmdStr) return;
      const term = document.getElementById('term-out');
      
      const p = document.createElement('div');
      p.className = 'cmd-line';
      p.textContent = '$ ' + cmdStr;
      term.appendChild(p);

      const r = document.createElement('div');
      r.className = 'cmd-res';

      try {
        const token = localStorage.getItem('atlas_token') || '';
        const res = await fetch('/api/v1/admin/cmd/execute', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Creator-Key': creatorPasscode,
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ command: cmdStr })
        });
        const data = await res.json();
        r.textContent = typeof data.output === 'object' ? JSON.stringify(data.output, null, 2) : (data.output || JSON.stringify(data));
      } catch (e) {
        r.textContent = 'Error: ' + e.message;
      }

      term.appendChild(r);
      term.scrollTop = term.scrollHeight;
    }

    function runCli() {
      const input = document.getElementById('cli-in');
      const val = input.value.trim();
      if (val) {
        input.value = '';
        exec(val);
      }
    }

    function clearLogs() {
      document.getElementById('term-out').innerHTML = '<div style="color: #666;">Cleared.</div>';
    }

    initModules();
  </script>
</body>
</html>
